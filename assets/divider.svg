<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e7b4f" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#1e7b4f" stop-opacity="0.35"/>
      <stop offset="0.88" stop-color="#1e7b4f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1e7b4f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e7b4f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1e7b4f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1e7b4f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sweep { animation: sweep 7s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes sweep {
      0% { transform: translateX(-760px); }
      70%, 100% { transform: translateX(760px); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0" y="5.5" width="1200" height="1" fill="url(#base)"/>
  <rect class="sweep" x="480" y="5" width="240" height="2" rx="1" fill="url(#light)"/>
</svg>
