[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sae-concept-lab"
version = "0.1.0"
description = "SAE Concept Lab -- standalone product UI (Gradio, stub-backed) plus the extracted concept-bundle contract. Extracted from qwen-sae-interp under recorded provenance; see BOUNDARY.md and provenance/source_import.json."
readme = "README.md"
# Raised from >=3.10 by the concept_bundle contract extraction
# (sae_concept_lab/canonical/concept_bundle/), which requires enum.StrEnum
# and datetime.fromisoformat's trailing-Z support -- both 3.11+, per the
# canonical export_inventory.json's own python.requires field.
requires-python = ">=3.11,<4"
dependencies = [
    # Pinned to the exact compatibility range this UI was built and tested
    # against in the source repo (qwen-sae-interp's own pyproject.toml pin
    # at the time of import, commit 9a9f3b7): Gradio 6.x only. gr.Chatbot's
    # message-format dict value shape and the gr.State/get_config_file
    # quirks documented in sae_concept_lab/README.md are specific to this
    # major version -- do not widen without re-running the full suite.
    "gradio>=6.22,<7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["sae_concept_lab*", "provenance*"]

[tool.setuptools.package-data]
"sae_concept_lab.fixtures" = ["*.json", "gemma/*.json", "qwen/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Matches qwen-sae-interp's own selected rule set (pyproject.toml [tool.ruff.lint]),
# so files extracted byte-for-byte from there are not re-litigated against a
# different, stricter default here. sae_concept_lab/canonical/concept_bundle/
# and tests/test_sae_concept_lab_*.py are hash-verified extractions (see
# provenance/source_import.json) and must never be edited to satisfy a lint
# rule -- if one of those files ever fails this exact rule set, that is a
# real finding to report, not something to silence here.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
